# Local stack: 3-node Kafka cluster in KRaft mode (no ZooKeeper) + Kafka UI.
# Each node runs in "combined" mode (broker + controller). Fine for local dev;
# production clusters usually run dedicated controller nodes.
name: delivery-pipeline

# Shared settings for every Kafka node (YAML anchors avoid copy-paste).
x-kafka-common: &kafka-common
  image: apache/kafka:4.0.0
  restart: unless-stopped # "docker stop kafka-2" keeps it down -> lets us test broker failure
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
    interval: 10s
    timeout: 15s
    retries: 12
    start_period: 20s

x-kafka-env: &kafka-env
  # Same cluster id on all nodes = they belong to one cluster.
  CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
  # Durability defaults: 3 copies, a write needs 2 in-sync copies when acks=all.
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  # Topics are created explicitly by kafka-init; typos must not create topics.
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_HEAP_OPTS: -Xms512m -Xmx512m

# Shared settings for our Python services (one image, different commands).
x-app: &app
  build: .
  image: delivery-pipeline-app:latest
  restart: unless-stopped # a crashed consumer restarts and resumes from its last committed offset
  depends_on:
    kafka-init: { condition: service_completed_successfully }

x-app-env: &app-env
  KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
  LOG_LEVEL: INFO

services:
  kafka-1:
    <<: *kafka-common
    container_name: kafka-1
    hostname: kafka-1
    ports: ["19092:19092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:19092

  kafka-2:
    <<: *kafka-common
    container_name: kafka-2
    hostname: kafka-2
    ports: ["29092:29092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:29092

  kafka-3:
    <<: *kafka-common
    container_name: kafka-3
    hostname: kafka-3
    ports: ["39092:39092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:39092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://localhost:39092

  # One-shot job: creates topics once all brokers are healthy, then exits.
  kafka-init:
    image: apache/kafka:4.0.0
    container_name: kafka-init
    restart: "no"
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }
    volumes:
      - ./infra/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.1.0
    container_name: kafka-ui
    restart: unless-stopped
    ports: ["8080:8080"]
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }
    environment:
      KAFKA_CLUSTERS_0_NAME: local-3-broker
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092

  # ------------------------------------------------------------ Python services
  simulator:
    <<: *app
    container_name: simulator
    command: ["python", "-m", "delivery_pipeline.simulator"]
    environment:
      <<: *app-env
      SIM_NUM_DRIVERS: ${SIM_NUM_DRIVERS:-100}
      SIM_ORDERS_PER_MINUTE: ${SIM_ORDERS_PER_MINUTE:-6}
      SIM_MALFORMED_RATE: ${SIM_MALFORMED_RATE:-0.01}

  alerts:
    <<: *app
    container_name: alerts
    command: ["python", "-m", "delivery_pipeline.alerts"]
    environment:
      <<: *app-env

  live-map:
    <<: *app
    container_name: live-map
    command: ["python", "-m", "delivery_pipeline.live_map"]
    ports: ["8000:8000"]
    environment:
      <<: *app-env
